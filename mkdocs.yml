site_name: defuqumat user guide
site_url: https://joselado.github.io/defuqumat/
repo_url: https://github.com/joselado/defuqumat
repo_name: joselado/defuqumat
docs_dir: docs/guide
site_dir: site
strict: true
validation:
  anchors: warn
  unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs/figures]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js

nav:
  - Home: index.md
  - Getting started:
      - Your own crystal: own-crystal.md
  - Ground state:
      - Total energy and the density: ground-state.md
      - Band structure: bands.md
      - Density of states: dos.md
  - Structure:
      - Forces and relaxation: forces.md
      - Stress and the cell: stress.md
      - Electric fields: electric-field.md
  - Magnetism:
      - Collinear and noncollinear magnetism: magnetism.md
      - Spin-orbit coupling: spin-orbit.md
      - Magnetic anisotropy: anisotropy.md
      - Spin spirals: spirals.md
      - Magnons: magnons.md
      - DFT+U: dft-plus-u.md
  - Response and spectra:
      - Dielectric constant, Born charges and phonons: phonons.md
      - Raman and infrared: raman.md
      - Optical spectra: optics.md
      - Nonlinear optics: nonlinear.md
      - Strain and polarization couplings: piezo.md
  - Topology: topology.md
  - Microscopy and scattering:
      - STM images and tunnelling: stm.md
      - Diffraction and nesting: scattering.md
  - Long-range modulations: ultracell.md
  - More:
      - Starting from an all-electron ground state: elk-seed.md
      - Performance and many cores: performance.md
      - Accuracy: accuracy.md
